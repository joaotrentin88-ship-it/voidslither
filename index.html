<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Void Snake - Jogue Online Grátis</title>

<meta name="description" content="Void Snake é um jogo de cobras online. Controle sua cobra, elimine bots, colete orbes e fique cada vez maior.">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Void Snake">
<meta property="og:description" content="Controle sua cobra, elimine bots e domine a arena.">
<meta property="og:type" content="website">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050509;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    background: #08080d;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: rgba(0,0,0,.55);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
}

#leaderboard {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 10;
    width: 190px;
    background: rgba(0,0,0,.6);
    border-radius: 10px;
    padding: 12px;
}

#leaderboard h3 {
    margin: 0 0 8px;
    text-align: center;
}

#leaderboard div {
    padding: 3px 0;
    font-size: 14px;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 20;
    background: rgba(0,0,0,.75);
}

#gameOver h1 {
    font-size: 55px;
    margin: 0 0 10px;
}

#gameOver p {
    font-size: 20px;
}

#restart {
    border: none;
    padding: 13px 25px;
    border-radius: 10px;
    background: #ffffff;
    color: #000;
    font-size: 18px;
    cursor: pointer;
}

#restart:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    Tamanho: <span id="score">20</span><br>
    Clique/Space = Boost
</div>

<div id="leaderboard">
    <h3>🏆 Ranking</h3>
    <div id="ranking"></div>
</div>

<div id="gameOver">
    <h1>💀 Você morreu!</h1>
    <p id="finalScore"></p>
    <button id="restart">Jogar novamente</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const ranking = document.getElementById("ranking");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartButton = document.getElementById("restart");

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
});

/* =========================
   CONFIGURAÇÕES
========================= */

const WORLD_SIZE = 6000;

const PLAYER_RADIUS = 14;
const BOT_RADIUS = 14;

const MIN_LENGTH = 12;

const NORMAL_SPEED = 3.2;
const BOOST_SPEED = 6;

const SEGMENT_DISTANCE = 8;

const BOOST_COST_TIME = 0.09;

const FOOD_COUNT = 450;
const BOT_COUNT = 18;

/* =========================
   MOUSE
========================= */

const mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("mousedown", () => {
    mouse.down = true;
});

window.addEventListener("mouseup", () => {
    mouse.down = false;
});

window.addEventListener("touchstart", e => {
    mouse.down = true;

    if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    }
});

window.addEventListener("touchmove", e => {
    if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    }
});

window.addEventListener("touchend", () => {
    mouse.down = false;
});

let spaceDown = false;

window.addEventListener("keydown", e => {
    if (e.code === "Space") {
        spaceDown = true;
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    if (e.code === "Space") {
        spaceDown = false;
    }
});

/* =========================
   FUNÇÕES
========================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function distanceXY(x1, y1, x2, y2) {
    return Math.hypot(x1 - x2, y1 - y2);
}

function randomColor() {
    const colors = [
        "#ff3b3b",
        "#3b82ff",
        "#22c55e",
        "#facc15",
        "#a855f7",
        "#ec4899",
        "#06b6d4",
        "#f97316"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
}

/* =========================
   ORBES
========================= */

const orbs = [];

function createOrb(x, y, value = 1, color = null) {
    orbs.push({
        x,
        y,
        value,
        radius: random(4, 8),
        color: color || randomColor()
    });
}

function createInitialOrbs() {
    for (let i = 0; i < FOOD_COUNT; i++) {
        createOrb(
            random(100, WORLD_SIZE - 100),
            random(100, WORLD_SIZE - 100),
            1
        );
    }
}

/* =========================
   PLAYER
========================= */

let player;

function createPlayer() {
    const x = WORLD_SIZE / 2;
    const y = WORLD_SIZE / 2;

    const body = [];

    for (let i = 0; i < 20; i++) {
        body.push({
            x: x - i * SEGMENT_DISTANCE,
            y
        });
    }

    return {
        x,
        y,

        angle: 0,

        targetLength: 20,

        body,

        color: "#ffffff",

        alive: true,

        boostTimer: 0,

        cameraX: x,
        cameraY: y
    };
}

/* =========================
   BOTS
========================= */

const bots = [];

function createBot() {
    const x = random(300, WORLD_SIZE - 300);
    const y = random(300, WORLD_SIZE - 300);

    const length = Math.floor(random(20, 55));

    const body = [];

    const angle = random(0, Math.PI * 2);

    for (let i = 0; i < length; i++) {
        body.push({
            x: x - Math.cos(angle) * i * SEGMENT_DISTANCE,
            y: y - Math.sin(angle) * i * SEGMENT_DISTANCE
        });
    }

    return {
        x,
        y,

        angle,

        targetLength: length,

        body,

        color: randomColor(),

        alive: true,

        turnTimer: random(30, 150),

        boostTimer: 0
    };
}

function createBots() {
    for (let i = 0; i < BOT_COUNT; i++) {
        bots.push(createBot());
    }
}

/* =========================
   MORTE DO BOT
========================= */

function killBot(bot) {

    if (!bot.alive) return;

    bot.alive = false;

    /*
       Cada parte do corpo vira um orb.
    */

    for (let i = 0; i < bot.body.length; i += 2) {

        const segment = bot.body[i];

        createOrb(
            segment.x + random(-8, 8),
            segment.y + random(-8, 8),
            2,
            bot.color
        );
    }

    bot.body.length = 0;
}

/* =========================
   BOOST DO PLAYER
========================= */

function usePlayerBoost() {

    if (player.targetLength <= MIN_LENGTH) {
        return;
    }

    /*
       Remove tamanho da cobra.
    */

    player.targetLength--;

    /*
       Pega a cauda atual.
    */

    const tail = player.body[player.body.length - 1];

    if (tail) {

        createOrb(
            tail.x + random(-3, 3),
            tail.y + random(-3, 3),
            1,
            player.color
        );
    }

    /*
       Remove imediatamente uma parte do corpo.
    */

    if (player.body.length > MIN_LENGTH) {
        player.body.pop();
    }
}

/* =========================
   ATUALIZAR PLAYER
========================= */

function updatePlayer(delta) {

    if (!player.alive) return;

    const dx = mouse.x - W / 2;
    const dy = mouse.y - H / 2;

    /*
       Se o mouse estiver muito perto,
       não gira.
    */

    if (Math.hypot(dx, dy) > 5) {
        player.angle = Math.atan2(dy, dx);
    }

    const boosting = mouse.down || spaceDown;

    const speed = boosting
        ? BOOST_SPEED
        : NORMAL_SPEED;

    player.x += Math.cos(player.angle) * speed * delta * 60;
    player.y += Math.sin(player.angle) * speed * delta * 60;

    /*
       Limites do mapa
    */

    player.x = Math.max(30, Math.min(WORLD_SIZE - 30, player.x));
    player.y = Math.max(30, Math.min(WORLD_SIZE - 30, player.y));

    /*
       Coloca nova cabeça.
    */

    const head = player.body[0];

    if (!head) return;

    const newHead = {
        x: player.x,
        y: player.y
    };

    /*
       Só adiciona novo segmento quando
       a cabeça estiver suficientemente longe.
    */

    if (distance(newHead, head) >= SEGMENT_DISTANCE) {

        player.body.unshift(newHead);
    } else {

        head.x = player.x;
        head.y = player.y;
    }

    /*
       Mantém o tamanho correto.
    */

    while (player.body.length > player.targetLength) {
        player.body.pop();
    }

    /*
       Boost consome tamanho continuamente.
    */

    if (boosting) {

        player.boostTimer += delta;

        if (player.boostTimer >= BOOST_COST_TIME) {

            player.boostTimer = 0;

            usePlayerBoost();
        }

    } else {

        player.boostTimer = 0;
    }

    /*
       Câmara segue o player.
    */

    player.cameraX += (player.x - player.cameraX) * 0.12;
    player.cameraY += (player.y - player.cameraY) * 0.12;
}

/* =========================
   ATUALIZAR BOT
========================= */

function updateBot(bot, delta) {

    if (!bot.alive) return;

    bot.turnTimer -= delta;

    /*
       De vez em quando escolhe
       uma direção nova.
    */

    if (bot.turnTimer <= 0) {

        bot.turnTimer = random(1, 4);

        bot.angle += random(-1.2, 1.2);
    }

    /*
       Às vezes o bot tenta perseguir o player.
    */

    const distToPlayer = distance(bot, player);

    if (distToPlayer < 900) {

        const targetAngle = Math.atan2(
            player.y - bot.y,
            player.x - bot.x
        );

        let diff = targetAngle - bot.angle;

        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        bot.angle += diff * 0.015;
    }

    /*
       Evita sair do mapa.
    */

    if (bot.x < 200) {
        bot.angle = 0;
    }

    if (bot.x > WORLD_SIZE - 200) {
        bot.angle = Math.PI;
    }

    if (bot.y < 200) {
        bot.angle = Math.PI / 2;
    }

    if (bot.y > WORLD_SIZE - 200) {
        bot.angle = -Math.PI / 2;
    }

    const speed = 2;

    bot.x += Math.cos(bot.angle) * speed * delta * 60;
    bot.y += Math.sin(bot.angle) * speed * delta * 60;

    bot.x = Math.max(30, Math.min(WORLD_SIZE - 30, bot.x));
    bot.y = Math.max(30, Math.min(WORLD_SIZE - 30, bot.y));

    /*
       Atualiza corpo.
    */

    const head = bot.body[0];

    if (!head) return;

    const newHead = {
        x: bot.x,
        y: bot.y
    };

    if (distance(newHead, head) >= SEGMENT_DISTANCE) {

        bot.body.unshift(newHead);

    } else {

        head.x = bot.x;
        head.y = bot.y;
    }

    while (bot.body.length > bot.targetLength) {
        bot.body.pop();
    }
}

/* =========================
   COLISÃO COM CORPO
========================= */

function headHitsBody(head, body, startIndex = 3) {

    if (!head || !body) return false;

    for (let i = startIndex; i < body.length; i++) {

        const segment = body[i];

        const d = distanceXY(
            head.x,
            head.y,
            segment.x,
            segment.y
        );

        if (d < PLAYER_RADIUS * 1.45) {
            return true;
        }
    }

    return false;
}

/* =========================
   COLISÕES
========================= */

function checkCollisions() {

    if (!player.alive) return;

    const playerHead = player.body[0];

    if (!playerHead) return;

    /*
       PLAYER CONTRA BOTS
    */

    for (const bot of bots) {

        if (!bot.alive) continue;

        const botHead = bot.body[0];

        if (!botHead) continue;

        /*
           Seu corpo mata a cabeça do bot.
        */

        if (headHitsBody(botHead, player.body, 4)) {

            killBot(bot);

            player.targetLength += 4;

            continue;
        }

        /*
           Sua cabeça bate no corpo do bot.
        */

        if (headHitsBody(playerHead, bot.body, 4)) {

            killPlayer();

            return;
        }

        /*
           Cabeça contra cabeça.
           A maior cobra vence.
        */

        const headDistance = distance(
            playerHead,
            botHead
        );

        if (headDistance < 22) {

            if (player.targetLength >= bot.targetLength) {

                killBot(bot);

                player.targetLength += 3;

            } else {

                killPlayer();

                return;
            }
        }
    }
}

/* =========================
   PLAYER PEGA ORB
========================= */

function collectOrbs() {

    if (!player.alive) return;

    const head = player.body[0];

    if (!head) return;

    for (let i = orbs.length - 1; i >= 0; i--) {

        const orb = orbs[i];

        if (
            distanceXY(
                head.x,
                head.y,
                orb.x,
                orb.y
            ) < PLAYER_RADIUS + orb.radius
        ) {

            player.targetLength += orb.value;

            orbs.splice(i, 1);
        }
    }
}

/* =========================
   MORTE DO PLAYER
========================= */

function killPlayer() {

    if (!player.alive) return;

    player.alive = false;

    /*
       O corpo do player também vira orbs.
    */

    for (let i = 0; i < player.body.length; i += 2) {

        const segment = player.body[i];

        createOrb(
            segment.x,
            segment.y,
            2,
            "#ffffff"
        );
    }

    finalScore.textContent =
        "Você chegou a " +
        Math.floor(player.targetLength) +
        " de tamanho.";

    gameOverScreen.style.display = "flex";
}

/* =========================
   RANKING
========================= */

function updateLeaderboard() {

    const players = [];

    players.push({
        name: "Você",
        length: player.targetLength,
        player: true
    });

    for (let i = 0; i < bots.length; i++) {

        const bot = bots[i];

        if (!bot.alive) continue;

        players.push({
            name: "Bot " + (i + 1),
            length: bot.targetLength,
            player: false
        });
    }

    players.sort((a, b) => b.length - a.length);

    ranking.innerHTML = "";

    players.slice(0, 8).forEach((p, index) => {

        const div = document.createElement("div");

        div.textContent =
            (index + 1) +
            ". " +
            p.name +
            " — " +
            Math.floor(p.length);

        if (p.player) {
            div.style.fontWeight = "bold";
        }

        ranking.appendChild(div);
    });
}

/* =========================
   DESENHO
========================= */

function drawWorld() {

    /*
       Fundo
    */

    ctx.fillStyle = "#08080d";
    ctx.fillRect(0, 0, W, H);

    /*
       Câmara
    */

    const cameraX = player.cameraX;
    const cameraY = player.cameraY;

    ctx.save();

    ctx.translate(
        W / 2 - cameraX,
        H / 2 - cameraY
    );

    /*
       Grade
    */

    const gridSize = 100;

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    const startX =
        Math.floor((cameraX - W / 2) / gridSize) * gridSize;

    const endX =
        cameraX + W / 2 + gridSize;

    for (let x = startX; x <= endX; x += gridSize) {

        ctx.beginPath();

        ctx.moveTo(x, cameraY - H / 2);
        ctx.lineTo(x, cameraY + H / 2);

        ctx.stroke();
    }

    const startY =
        Math.floor((cameraY - H / 2) / gridSize) * gridSize;

    const endY =
        cameraY + H / 2 + gridSize;

    for (let y = startY; y <= endY; y += gridSize) {

        ctx.beginPath();

        ctx.moveTo(cameraX - W / 2, y);
        ctx.lineTo(cameraX + W / 2, y);

        ctx.stroke();
    }

    /*
       Borda do mapa
    */

    ctx.strokeStyle = "#444";
    ctx.lineWidth = 5;

    ctx.strokeRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );

    /*
       Orbs
    */

    for (const orb of orbs) {

        ctx.beginPath();

        ctx.arc(
            orb.x,
            orb.y,
            orb.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = orb.color;
        ctx.fill();

        ctx.shadowBlur = 12;
        ctx.shadowColor = orb.color;

        ctx.fill();

        ctx.shadowBlur = 0;
    }

    /*
       Bots
    */

    for (const bot of bots) {

        if (!bot.alive) continue;

        drawSnake(bot.body, bot.color);
    }

    /*
       Player
    */

    if (player.alive) {

        drawSnake(
            player.body,
            player.color,
            true
        );
    }

    ctx.restore();
}

/* =========================
   DESENHAR COBRA
========================= */

function drawSnake(body, color, isPlayer = false) {

    if (!body || body.length === 0) return;

    /*
       Corpo
    */

    for (let i = body.length - 1; i >= 0; i--) {

        const segment = body[i];

        const progress = i / Math.max(body.length, 1);

        const radius =
            isPlayer
                ? 14
                : 13;

        ctx.beginPath();

        ctx.arc(
            segment.x,
            segment.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = color;
        ctx.fill();
    }

    /*
       Cabeça
    */

    const head = body[0];

    if (!head) return;

    ctx.beginPath();

    ctx.arc(
        head.x,
        head.y,
        isPlayer ? 17 : 16,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = color;
    ctx.fill();

    /*
       Olhos
    */

    const angle = isPlayer
        ? player.angle
        : 0;

    let eyeAngle;

    if (isPlayer) {
        eyeAngle = player.angle;
    } else {

        /*
           Descobre direção usando
           o segundo segmento.
        */

        if (body.length > 1) {

            eyeAngle = Math.atan2(
                head.y - body[1].y,
                head.x - body[1].x
            );

        } else {

            eyeAngle = 0;
        }
    }

    const eyeDistance = 7;

    const eye1X =
        head.x +
        Math.cos(eyeAngle - 0.45) *
        eyeDistance;

    const eye1Y =
        head.y +
        Math.sin(eyeAngle - 0.45) *
        eyeDistance;

    const eye2X =
        head.x +
        Math.cos(eyeAngle + 0.45) *
        eyeDistance;

    const eye2Y =
        head.y +
        Math.sin(eyeAngle + 0.45) *
        eyeDistance;

    ctx.fillStyle = "#000";

    ctx.beginPath();
    ctx.arc(eye1X, eye1Y, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eye2X, eye2Y, 3, 0, Math.PI * 2);
    ctx.fill();
}

/* =========================
   LOOP
========================= */

let lastTime = performance.now();

function gameLoop(currentTime) {

    const delta =
        Math.min(
            (currentTime - lastTime) / 1000,
            0.05
        );

    lastTime = currentTime;

    if (player.alive) {

        updatePlayer(delta);

        for (const bot of bots) {
            updateBot(bot, delta);
        }

        checkCollisions();

        collectOrbs();

        scoreText.textContent =
            Math.floor(player.targetLength);

        updateLeaderboard();
    }

    drawWorld();

    requestAnimationFrame(gameLoop);
}

/* =========================
   RESTART
========================= */

restartButton.addEventListener("click", () => {

    /*
       Limpa orbs
    */

    orbs.length = 0;

    /*
       Limpa bots
    */

    bots.length = 0;

    /*
       Cria tudo novamente
    */

    createInitialOrbs();

    createBots();

    player = createPlayer();

    gameOverScreen.style.display = "none";

    scoreText.textContent =
        player.targetLength;
});

/* =========================
   INICIAR
========================= */

createInitialOrbs();

createBots();

player = createPlayer();

updateLeaderboard();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
