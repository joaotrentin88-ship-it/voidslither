<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Void Snake - Jogue Online Grátis</title>

    <meta name="description"
        content="Jogue Void Snake online gratuitamente. Controle sua cobra, colete orbs, cresça e enfrente outras cobras em uma arena.">

    <meta name="robots" content="index, follow">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;

            color: white;

            background: rgba(0, 0, 0, 0.55);

            padding: 12px 16px;

            border-radius: 10px;

            user-select: none;
        }

        #leaderboard {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10;

            color: white;

            background: rgba(0, 0, 0, 0.55);

            padding: 12px 16px;

            border-radius: 10px;

            min-width: 170px;

            user-select: none;
        }

        #leaderboard h3 {
            margin: 0 0 8px;
        }

        #gameOver {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 20;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;
        }

        #gameOver h1 {
            font-size: 50px;
            margin: 0 0 10px;
        }

        button {

            border: none;

            padding: 12px 25px;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

    </style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    🐍 <b>Void Snake</b>

    <br><br>

    Tamanho:
    <span id="score">15</span>

    <br>

    Velocidade:
    <span id="speed">Normal</span>

    <br><br>

    🖱️ Mova o mouse

    <br>

    ⚡ Clique ou SPACE para boost

</div>


<div id="leaderboard">

    <h3>🏆 Ranking</h3>

    <div id="ranking"></div>

</div>


<div id="gameOver">

    <h1>Game Over</h1>

    <p>
        Seu tamanho:
        <span id="finalScore">0</span>
    </p>

    <button onclick="restartGame()">
        Jogar novamente
    </button>

</div>


<script>

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");


const scoreElement =
    document.getElementById("score");

const speedElement =
    document.getElementById("speed");

const rankingElement =
    document.getElementById("ranking");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScoreElement =
    document.getElementById("finalScore");


function resizeCanvas() {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================
        CONFIGURAÇÕES
========================= */

const WORLD_SIZE = 6000;

const START_LENGTH = 15;

const MIN_LENGTH = 8;

const NORMAL_SPEED = 2.8;

const BOOST_SPEED = 5.0;

const BOOST_LOSS_INTERVAL = 7;


/* =========================
        CONTROLES
========================= */

let mouseX =
    canvas.width / 2;

let mouseY =
    canvas.height / 2;

let boosting = false;

let gameRunning = true;


/* =========================
        OBJETOS
========================= */

const foods = [];

const bots = [];


/* =========================
        JOGADOR
========================= */

const player = {

    x: WORLD_SIZE / 2,

    y: WORLD_SIZE / 2,

    angle: 0,

    speed: NORMAL_SPEED,

    radius: 13,

    body: [],

    length: START_LENGTH,

    boostCounter: 0

};


for (
    let i = 0;
    i < player.length;
    i++
) {

    player.body.push({

        x: player.x - i * 10,

        y: player.y

    });

}


/* =========================
        POSIÇÃO RANDOM
========================= */

function randomPosition() {

    return {

        x:
            Math.random() *
            (WORLD_SIZE - 300) +
            150,

        y:
            Math.random() *
            (WORLD_SIZE - 300) +
            150

    };

}


/* =========================
        CRIAR ORB
========================= */

function createOrb(x, y, value = 1) {

    foods.push({

        x: x,

        y: y,

        radius:
            5 +
            Math.random() * 3,

        value: value

    });

}


/* =========================
        COMIDA INICIAL
========================= */

function createRandomFood() {

    const pos =
        randomPosition();

    createOrb(
        pos.x,
        pos.y
    );

}


for (
    let i = 0;
    i < 500;
    i++
) {

    createRandomFood();

}


/* =========================
        BOT
========================= */

class Bot {

    constructor() {

        const pos =
            randomPosition();

        this.x = pos.x;

        this.y = pos.y;

        this.angle =
            Math.random() *
            Math.PI * 2;

        this.speed =
            1.7 +
            Math.random() * 1.2;

        this.radius = 12;

        this.length =
            10 +
            Math.floor(
                Math.random() * 25
            );

        this.body = [];

        this.alive = true;

        this.color =
            `hsl(
                ${Math.random() * 360},
                80%,
                55%
            )`;

        this.turnTimer = 0;


        for (
            let i = 0;
            i < this.length;
            i++
        ) {

            this.body.push({

                x:
                    this.x -
                    i * 9,

                y:
                    this.y

            });

        }

    }


    update() {

        if (!this.alive) {
            return;
        }


        this.turnTimer--;


        if (
            this.turnTimer <= 0
        ) {

            this.angle +=
                (Math.random() - 0.5)
                * 1.4;

            this.turnTimer =
                30 +
                Math.random() * 100;

        }


        this.x +=
            Math.cos(this.angle)
            * this.speed;

        this.y +=
            Math.sin(this.angle)
            * this.speed;


        /* BORDAS */

        if (
            this.x < 100 ||
            this.x >
            WORLD_SIZE - 100
        ) {

            this.angle =
                Math.PI -
                this.angle;

        }


        if (
            this.y < 100 ||
            this.y >
            WORLD_SIZE - 100
        ) {

            this.angle =
                -this.angle;

        }


        this.body.unshift({

            x: this.x,

            y: this.y

        });


        while (
            this.body.length >
            this.length
        ) {

            this.body.pop();

        }


        this.eatFood();

    }


    eatFood() {

        for (
            let i = foods.length - 1;
            i >= 0;
            i--
        ) {

            const food =
                foods[i];


            const distance =
                Math.hypot(
                    this.x - food.x,
                    this.y - food.y
                );


            if (
                distance <
                this.radius +
                food.radius
            ) {

                foods.splice(i, 1);

                this.length++;

                createRandomFood();

                break;

            }

        }

    }


    draw(cameraX, cameraY) {

        if (!this.alive) {
            return;
        }


        ctx.beginPath();


        for (
            let i =
                this.body.length - 1;
            i >= 0;
            i--
        ) {

            const part =
                this.body[i];


            const sx =
                part.x -
                cameraX +
                canvas.width / 2;


            const sy =
                part.y -
                cameraY +
                canvas.height / 2;


            if (
                i ===
                this.body.length - 1
            ) {

                ctx.moveTo(
                    sx,
                    sy
                );

            } else {

                ctx.lineTo(
                    sx,
                    sy
                );

            }

        }


        ctx.strokeStyle =
            this.color;

        ctx.lineWidth =
            this.radius * 2;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.stroke();


        const head =
            this.body[0];


        const sx =
            head.x -
            cameraX +
            canvas.width / 2;


        const sy =
            head.y -
            cameraY +
            canvas.height / 2;


        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.color;

        ctx.fill();

    }

}


/* =========================
        CRIAR BOTS
========================= */

for (
    let i = 0;
    i < 18;
    i++
) {

    bots.push(
        new Bot()
    );

}


/* =========================
        MOUSE
========================= */

canvas.addEventListener(
    "mousemove",
    event => {

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }
);


/* =========================
        BOOST
========================= */

canvas.addEventListener(
    "mousedown",
    () => {

        boosting = true;

    }
);


canvas.addEventListener(
    "mouseup",
    () => {

        boosting = false;

    }
);


window.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
        ) {

            boosting = true;

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.code === "Space"
        ) {

            boosting = false;

        }

    }
);


/* =========================
        SOLTAR MASSA
========================= */

function dropBoostOrb() {

    if (
        player.body.length <=
        MIN_LENGTH
    ) {

        return;

    }


    /*
        Pegamos uma parte
        perto da cauda.
    */

    const tailIndex =
        player.body.length - 1;


    const tail =
        player.body[tailIndex];


    createOrb(
        tail.x,
        tail.y,
        1
    );


    player.body.pop();

    player.length--;

}


/* =========================
        ATUALIZAR JOGADOR
========================= */

function updatePlayer() {

    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;


    const dx =
        mouseX - centerX;

    const dy =
        mouseY - centerY;


    if (
        Math.hypot(dx, dy) > 10
    ) {

        player.angle =
            Math.atan2(
                dy,
                dx
            );

    }


    let currentSpeed;


    if (
        boosting &&
        player.length >
        MIN_LENGTH
    ) {

        currentSpeed =
            BOOST_SPEED;

        player.boostCounter++;


        /*
            A cada alguns frames
            perde uma parte.
        */

        if (
            player.boostCounter >=
            BOOST_LOSS_INTERVAL
        ) {

            dropBoostOrb();

            player.boostCounter = 0;

        }

    } else {

        currentSpeed =
            NORMAL_SPEED;

        player.boostCounter = 0;

    }


    player.x +=
        Math.cos(player.angle)
        * currentSpeed;


    player.y +=
        Math.sin(player.angle)
        * currentSpeed;


    /* BORDAS */

    player.x =
        Math.max(
            50,
            Math.min(
                WORLD_SIZE - 50,
                player.x
            )
        );


    player.y =
        Math.max(
            50,
            Math.min(
                WORLD_SIZE - 50,
                player.y
            )
        );


    player.body.unshift({

        x: player.x,

        y: player.y

    });


    while (
        player.body.length >
        player.length
    ) {

        player.body.pop();

    }


    eatFood();


    checkPlayerCollisions();

}


/* =========================
        COMER ORBS
========================= */

function eatFood() {

    for (
        let i = foods.length - 1;
        i >= 0;
        i--
    ) {

        const food =
            foods[i];


        const distance =
            Math.hypot(
                player.x - food.x,
                player.y - food.y
            );


        if (
            distance <
            player.radius +
            food.radius
        ) {

            foods.splice(i, 1);


            player.length +=
                food.value;


            createRandomFood();

        }

    }

}


/* =========================
        MORRER BOT
========================= */

function killBot(bot) {

    if (!bot.alive) {
        return;
    }


    bot.alive = false;


    /*
        Transforma o corpo
        inteiro em orbs.
    */

    for (
        let i = 0;
        i < bot.body.length;
        i += 2
    ) {

        const part =
            bot.body[i];


        createOrb(
            part.x,
            part.y,
            1
        );

    }

}


/* =========================
        COLISÕES
========================= */

function checkPlayerCollisions() {

    for (
        const bot of bots
    ) {

        if (!bot.alive) {
            continue;
        }


        /*
            Se a cabeça do bot
            bater no nosso corpo,
            o bot morre.
        */

        for (
            let i = 5;
            i < player.body.length;
            i++
        ) {

            const part =
                player.body[i];


            const distance =
                Math.hypot(
                    bot.x - part.x,
                    bot.y - part.y
                );


            if (
                distance <
                bot.radius +
                player.radius
            ) {

                killBot(bot);

                break;

            }

        }


        /*
            Se nossa cabeça bater
            no corpo do bot,
            nós morremos.
        */

        if (!bot.alive) {
            continue;
        }


        for (
            let i = 5;
            i < bot.body.length;
            i++
        ) {

            const part =
                bot.body[i];


            const distance =
                Math.hypot(
                    player.x - part.x,
                    player.y - part.y
                );


            if (
                distance <
                player.radius +
                bot.radius
            ) {

                endGame();

                return;

            }

        }

    }

}


/* =========================
        BOTS VS BOTS
========================= */

function checkBotCollisions() {

    for (
        let a = 0;
        a < bots.length;
        a++
    ) {

        const botA =
            bots[a];


        if (!botA.alive) {
            continue;
        }


        for (
            let b = 0;
            b < bots.length;
            b++
        ) {

            if (a === b) {
                continue;
            }


            const botB =
                bots[b];


            if (!botB.alive) {
                continue;
            }


            /*
                Cabeça A bate no corpo B
            */

            for (
                let i = 5;
                i < botB.body.length;
                i++
            ) {

                const part =
                    botB.body[i];


                const distance =
                    Math.hypot(
                        botA.x - part.x,
                        botA.y - part.y
                    );


                if (
                    distance <
                    botA.radius +
                    botB.radius
                ) {

                    killBot(botA);

                    break;

                }

            }

        }

    }

}


/* =========================
        BACKGROUND
========================= */

function drawBackground(
    cameraX,
    cameraY
) {

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const gridSize = 100;


    ctx.strokeStyle =
        "#222";

    ctx.lineWidth = 1;


    const startX =
        -(
            (
                cameraX -
                canvas.width / 2
            ) %
            gridSize
        );


    const startY =
        -(
            (
                cameraY -
                canvas.height / 2
            ) %
            gridSize
        );


    for (
        let x = startX;
        x < canvas.width;
        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = startY;
        y < canvas.height;
        y += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    /*
        Borda do mapa
    */

    const borderX =
        WORLD_SIZE / 2 -
        cameraX +
        canvas.width / 2;


    const borderY =
        WORLD_SIZE / 2 -
        cameraY +
        canvas.height / 2;


    ctx.strokeStyle =
        "#555";

    ctx.lineWidth = 5;


    ctx.strokeRect(
        borderX -
        WORLD_SIZE / 2,

        borderY -
        WORLD_SIZE / 2,

        WORLD_SIZE,

        WORLD_SIZE
    );

}


/* =========================
        DESENHAR ORBS
========================= */

function drawFood(
    cameraX,
    cameraY
) {

    for (
        const food of foods
    ) {

        const sx =
            food.x -
            cameraX +
            canvas.width / 2;


        const sy =
            food.y -
            cameraY +
            canvas.height / 2;


        if (
            sx < -20 ||
            sx >
            canvas.width + 20 ||
            sy < -20 ||
            sy >
            canvas.height + 20
        ) {

            continue;

        }


        ctx.beginPath();


        ctx.arc(
            sx,
            sy,
            food.radius,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `hsl(
                ${(food.x + food.y) % 360},
                90%,
                60%
            )`;


        ctx.fill();

    }

}


/* =========================
        DESENHAR PLAYER
========================= */

function drawPlayer(
    cameraX,
    cameraY
) {

    ctx.beginPath();


    for (
        let i =
            player.body.length - 1;
        i >= 0;
        i--
    ) {

        const part =
            player.body[i];


        const sx =
            part.x -
            cameraX +
            canvas.width / 2;


        const sy =
            part.y -
            cameraY +
            canvas.height / 2;


        if (
            i ===
            player.body.length - 1
        ) {

            ctx.moveTo(
                sx,
                sy
            );

        } else {

            ctx.lineTo(
                sx,
                sy
            );

        }

    }


    ctx.strokeStyle =
        "#00ff88";

    ctx.lineWidth =
        player.radius * 2;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.stroke();


    /*
        CABEÇA
    */

    const head =
        player.body[0];


    const sx =
        head.x -
        cameraX +
        canvas.width / 2;


    const sy =
        head.y -
        cameraY +
        canvas.height / 2;


    ctx.beginPath();


    ctx.arc(
        sx,
        sy,
        player.radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#00ff88";

    ctx.fill();


    /*
        OLHOS
    */

    ctx.fillStyle =
        "black";


    const eyeDistance = 5;


    ctx.beginPath();

    ctx.arc(
        sx +
        Math.cos(
            player.angle - 0.5
        ) *
        eyeDistance,

        sy +
        Math.sin(
            player.angle - 0.5
        ) *
        eyeDistance,

        2,

        0,

        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        sx +
        Math.cos(
            player.angle + 0.5
        ) *
        eyeDistance,

        sy +
        Math.sin(
            player.angle + 0.5
        ) *
        eyeDistance,

        2,

        0,

        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
        RANKING
========================= */

function updateRanking() {

    const scores = [

        {
            name: "Você",

            score:
                player.length
        }

    ];


    bots.forEach(
        (bot, index) => {

            if (!bot.alive) {
                return;
            }


            scores.push({

                name:
                    "Bot " +
                    (index + 1),

                score:
                    bot.length

            });

        }
    );


    scores.sort(
        (a, b) =>
            b.score -
            a.score
    );


    rankingElement.innerHTML =
        "";


    scores
        .slice(0, 8)
        .forEach(
            (item, index) => {

                rankingElement.innerHTML +=
                    `${index + 1}. ${item.name} — ${item.score}<br>`;

            }
        );

}


/* =========================
        GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    finalScoreElement.textContent =
        player.length;

    gameOverScreen.style.display =
        "flex";

}


/* =========================
        RESTART
========================= */

function restartGame() {

    location.reload();

}


/* =========================
        GAME LOOP
========================= */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    updatePlayer();


    bots.forEach(
        bot =>
            bot.update()
    );


    checkBotCollisions();


    const cameraX =
        player.x;

    const cameraY =
        player.y;


    drawBackground(
        cameraX,
        cameraY
    );


    drawFood(
        cameraX,
        cameraY
    );


    bots.forEach(
        bot => {

            bot.draw(
                cameraX,
                cameraY
            );

        }
    );


    drawPlayer(
        cameraX,
        cameraY
    );


    scoreElement.textContent =
        player.length;


    speedElement.textContent =
        boosting &&
        player.length >
        MIN_LENGTH
            ? "BOOST ⚡"
            : "Normal";


    updateRanking();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
